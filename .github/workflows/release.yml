name: Release

on:
  push:
    branches: [main]
    paths:
      - custom_components/icsee_playback/manifest.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from manifest
        id: ver
        run: |
          version=$(python3 -c "import json; print(json.load(open('custom_components/icsee_playback/manifest.json'))['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version in manifest: $version"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists — nothing to do."
            exit 0
          fi

          prev=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty')
          if [ -n "$prev" ]; then
            notes=$(git log --pretty=format:'- %s' "${prev}..HEAD")
          else
            notes=$(git log --pretty=format:'- %s' -20)
          fi
          if [ -z "$notes" ]; then
            notes="Release ${VERSION}"
          fi

          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes "$notes" \
            --target "${GITHUB_SHA}"
          echo "Published $VERSION"
